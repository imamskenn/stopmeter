name: freebuff-sync

on:
  push:
    paths:
      - '.github/freebuff-sync/apply.py'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Terapkan patch
        run: python3 .github/freebuff-sync/apply.py

      - name: Commit dan push ke main
        run: |
          git config user.name "Imam S. K"
          git config user.email "imamskenn@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
            exit 0
          fi
          git commit -m "Tampilkan nama admin Inchas dan rekap per admin di dashboard"
          git push origin HEAD:main
